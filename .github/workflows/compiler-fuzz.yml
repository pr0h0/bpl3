name: Compiler Fuzz

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:
    inputs:
      iterations:
        description: "Iterations per seed"
        required: false
        default: "100000"
      seeds:
        description: "Comma-separated decimal or 0x-prefixed seeds"
        required: false
        default: "0x5eed1234,0xc0ffee,0xbad5eed"

permissions:
  contents: read

jobs:
  fuzz:
    name: Deterministic compiler fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      FUZZ_ITERATIONS: ${{ github.event.inputs.iterations || '100000' }}
      FUZZ_SEEDS: ${{ github.event.inputs.seeds || '0x5eed1234,0xc0ffee,0xbad5eed' }}
      FUZZ_DIFFERENTIAL_SEEDS: 0xd1ff0,0xd1ff1,0xd1ff2
      FUZZ_CRASH_DIR: fuzz/crashes
      FUZZ_PROGRESS: "1000"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          npm ci --prefix vscode-ext

      - name: Type check
        run: bun run check

      - name: Prepare crash artifact directory
        run: |
          rm -rf "$FUZZ_CRASH_DIR"
          mkdir -p "$FUZZ_CRASH_DIR"

      - name: Run deterministic compiler fuzz
        run: bun run fuzz:long

      - name: Run deterministic differential compiler fuzz
        run: bun run fuzz:differential

      - name: Minimize fuzz crash artifacts
        if: failure()
        run: |
          shopt -s nullglob
          status=0
          for metadata in "$FUZZ_CRASH_DIR"/*.json; do
            out="${metadata%.json}.min.bpl"
            echo "Minimizing $metadata -> $out"
            if ! bun run fuzz:replay -- --metadata "$metadata" --minimize --out "$out"; then
              status=1
            fi
          done
          exit "$status"

      - name: Upload fuzz crash artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compiler-fuzz-crashes
          path: fuzz/crashes
          if-no-files-found: ignore
          retention-days: 14
