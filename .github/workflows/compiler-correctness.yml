name: Compiler Correctness

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  windows-codegen:
    name: Windows parser/typecheck/codegen smoke
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          npm ci --prefix vscode-ext

      - name: Type check
        run: bun run check

      - name: Run Windows-safe codegen tests
        run: bun run test:codegen-cross-platform

  correctness:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu system clang release
            os: ubuntu-24.04
            toolchain: ubuntu-system
            cc: clang
            runtime_build: release
            ci_safe: true
          - name: Ubuntu clang 18 debug
            os: ubuntu-24.04
            toolchain: ubuntu-clang-18
            cc: clang-18
            runtime_build: debug
            ci_safe: false
          - name: macOS Apple clang release
            os: macos-15
            toolchain: macos-apple-clang
            cc: clang
            runtime_build: release
            ci_safe: false
          - name: macOS brew LLVM debug
            os: macos-15
            toolchain: macos-brew-llvm
            cc: clang
            runtime_build: debug
            ci_safe: false
    env:
      CC: ${{ matrix.cc }}
      BPL_RUNTIME_BUILD: ${{ matrix.runtime_build }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install LLVM toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm lld libclang-rt-dev clang-18 llvm-18 lld-18 libclang-rt-18-dev

      - name: Select clang 18
        if: matrix.toolchain == 'ubuntu-clang-18'
        run: |
          mkdir -p "$RUNNER_TEMP/bpl-toolchain/bin"
          ln -sf "$(command -v clang-18)" "$RUNNER_TEMP/bpl-toolchain/bin/clang"
          echo "$RUNNER_TEMP/bpl-toolchain/bin" >> "$GITHUB_PATH"

      - name: Install LLVM toolchain (macOS brew)
        if: matrix.toolchain == 'macos-brew-llvm'
        run: |
          brew install llvm lld
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"

      - name: Install WebAssembly linker (macOS Apple clang)
        if: matrix.toolchain == 'macos-apple-clang'
        run: brew install lld

      - name: Configure WebAssembly linker
        shell: bash
        run: |
          if command -v wasm-ld >/dev/null 2>&1; then
            echo "WASM_LD=$(command -v wasm-ld)" >> "$GITHUB_ENV"
          elif command -v wasm-ld-18 >/dev/null 2>&1; then
            echo "WASM_LD=$(command -v wasm-ld-18)" >> "$GITHUB_ENV"
          elif command -v ld.lld >/dev/null 2>&1; then
            echo "WASM_LD=$(command -v ld.lld)" >> "$GITHUB_ENV"
          elif [ -x "$(brew --prefix lld 2>/dev/null)/bin/wasm-ld" ]; then
            echo "WASM_LD=$(brew --prefix lld)/bin/wasm-ld" >> "$GITHUB_ENV"
          elif [ -x "$(brew --prefix llvm 2>/dev/null)/bin/wasm-ld" ]; then
            echo "WASM_LD=$(brew --prefix llvm)/bin/wasm-ld" >> "$GITHUB_ENV"
          else
            echo "wasm-ld is required for compiler correctness CI"
            exit 1
          fi

      - name: Show selected toolchain
        run: |
          "$CC" --version
          clang --version
          "$WASM_LD" --version

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          npm ci --prefix vscode-ext

      - name: Type check
        run: bun run check

      - name: Run WebAssembly runtime tests
        env:
          BPL_REQUIRE_WASM_LD: "1"
        run: bun run test:wasm

      - name: Run CI-safe test suite
        if: matrix.ci_safe == true
        env:
          BPL_INTEGRATION_JOBS: "4"
        run: bun run test:ci

      - name: Run compiler correctness tests
        env:
          BPL_REQUIRE_WASM_LD: "1"
        run: bun run test:correctness

      - name: Validate saved fuzz failure artifacts
        run: bun run fuzz:validate-artifacts

      - name: Run sanitizer-backed runtime tests
        run: bun run test:sanitizers
