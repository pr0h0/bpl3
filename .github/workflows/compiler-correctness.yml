name: Compiler Correctness

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  correctness:
    name: Typecheck and compiler correctness tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install LLVM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libclang-rt-dev

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          npm ci --prefix vscode-ext

      - name: Type check
        run: bun run check

      - name: Run CI-safe test suite
        env:
          BPL_INTEGRATION_JOBS: "4"
        run: bun run test:ci

      - name: Run compiler correctness tests
        run: bun run test:correctness

      - name: Run sanitizer-backed runtime tests
        run: bun run test:sanitizers
