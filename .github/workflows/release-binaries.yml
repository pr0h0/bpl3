name: Release binaries

# Builds the standalone `bpl` executable for each platform and checks that it
# compiles and runs a program using only its embedded standard library. A
# release tag (or a manual run with `publish`) attaches the binaries and
# SHA256SUMS to a draft GitHub release; the maintainer publishes it.
on:
  push:
    branches: [master]
    tags: ["v[0-9]*.[0-9]*.[0-9]*"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: "Attach the binaries to a draft release for the current tag (maintainer release action)"
        type: boolean
        default: false
        required: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: release-binaries-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: bpl-${{ matrix.asset }}
    if: github.event.deleted != true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            asset: linux-x64
            target: bun-linux-x64
            smoke: true
          - os: ubuntu-24.04-arm
            asset: linux-arm64
            target: bun-linux-arm64
            smoke: true
          - os: macos-15
            asset: darwin-arm64
            target: bun-darwin-arm64
            smoke: true
          # Cross-compiled; macOS runners are arm64, so it is not run here.
          - os: macos-15
            asset: darwin-x64
            target: bun-darwin-x64
            smoke: false
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: deps-bun-${{ runner.os }}-${{ hashFiles('.bun-version', 'bun.lock') }}
          restore-keys: deps-bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the standalone executable
        run: |
          bun run generate:embedded
          bun build --compile --target=${{ matrix.target }} --outfile="dist/bpl-${{ matrix.asset }}" ./index.ts

      - name: Smoke test outside the checkout
        if: matrix.smoke
        run: |
          binary="$PWD/dist/bpl-${{ matrix.asset }}"
          cd "$RUNNER_TEMP"
          "$binary" --version
          printf 'import printf from "std/c.bpl";\nframe main() ret int {\n    printf("release smoke ok\\n");\n    return 0;\n}\n' > smoke.bpl
          output=$(env -u BPL_HOME "$binary" run smoke.bpl)
          echo "$output"
          [ "$output" = "release smoke ok" ]

      - name: Upload the executable
        uses: actions/upload-artifact@v4
        with:
          name: bpl-${{ matrix.asset }}
          path: dist/bpl-${{ matrix.asset }}
          if-no-files-found: error

  publish:
    name: Attach binaries to a draft release
    needs: build
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.event.deleted != true) || (github.event_name == 'workflow_dispatch' && inputs.publish && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate patch-only release version
        run: |
          tag="${GITHUB_REF_NAME}"
          [[ "$tag" =~ ^v0\.1\.(0|[1-9][0-9]*)$ ]] || { echo "Only v0.1.x tags are released" >&2; exit 1; }
          version=$(node -p 'require("./package.json").version')
          [ "v$version" = "$tag" ] || { echo "Tag $tag does not match package.json $version" >&2; exit 1; }

      - name: Download the executables
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Attach to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          chmod +x bpl-*
          sha256sum bpl-* > SHA256SUMS
          tag="${GITHUB_REF_NAME}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --draft --verify-tag --title "$tag" --notes "Standalone bpl executables for $tag; see CHANGELOG.md."
          fi
          gh release upload "$tag" bpl-* SHA256SUMS --clobber
