<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BPL Tutorial</title>
    <meta
      name="description"
      content="A step-by-step introduction to the BPL programming language, with runnable examples."
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header class="site-header">
      <a class="site-title" href="index.html">BPL</a>
      <nav class="site-nav" aria-label="Main">
        <a href="index.html">Playground</a>
        <a href="tutorial.html" aria-current="page">Tutorial</a>
      </nav>
    </header>

    <div class="course">
      <nav class="course-outline" id="course-outline" aria-label="Lessons">
        <h2>Learn BPL</h2>
        <p class="course-progress" id="course-progress">Loading lessons</p>
        <button
          class="btn btn-small outline-toggle"
          id="outline-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="outline-list"
        >
          Show all lessons
        </button>
        <div class="outline-body" id="outline-list"></div>
      </nav>

      <main class="lesson" id="lesson">
        <p class="lesson-meta">Loading the tutorial...</p>
      </main>
    </div>

    <div id="toast-container" class="toast-container" aria-live="polite"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
    <script src="bplSyntax.js"></script>
    <script src="markdown.js"></script>
    <script src="tutorial.js"></script>
  </body>
</html>
