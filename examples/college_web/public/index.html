<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'"
    />
    <title>BPL Project Board</title>
    <link rel="stylesheet" href="/app.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">BUILT WITH BPL</p>
        <h1>Project board</h1>
        <p>Your tasks, saved privately to your account.</p>
      </header>
      <p id="status" role="status" aria-live="polite"></p>
      <section id="auth" aria-label="Sign in">
        <form id="sign-in">
          <label for="username">Username</label
          ><input
            id="username"
            name="username"
            autocomplete="username"
            minlength="3"
            maxlength="32"
            pattern="[a-z0-9_]{3,32}"
            required
            aria-describedby="username-help"
          />
          <small id="username-help"
            >3–32 lowercase letters, digits, or underscores.</small
          >
          <label for="password">Password</label
          ><input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            maxlength="256"
            required
            aria-describedby="password-help"
          />
          <small id="password-help"
            >New accounts need a password of at least 12 bytes.</small
          >
          <div class="auth-actions">
            <button id="login" type="submit">Sign in</button
            ><button id="register" type="button" class="secondary">
              Create account
            </button>
          </div>
        </form>
      </section>
      <section id="board" hidden>
        <div class="account-row">
          <p id="account"></p>
          <button id="logout" class="secondary">Sign out</button>
        </div>
        <form id="create">
          <label for="title">New task</label>
          <div class="input-row">
            <input
              id="title"
              name="title"
              maxlength="120"
              required
              placeholder="What needs doing?"
            /><button>Add task</button>
          </div>
        </form>
        <ul id="tasks" aria-label="Tasks"></ul>
        <nav aria-label="Pages">
          <button id="previous">Previous</button><span id="page"></span
          ><button id="next">Next</button>
        </nav>
      </section>
      <footer>
        Private accounts · SQLite persistence · BPL process workers
      </footer>
    </main>
  </body>
</html>
