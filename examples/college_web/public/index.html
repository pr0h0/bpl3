<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BPL Project Board</title><link rel="stylesheet" href="/app.css"><script src="/app.js" defer></script></head>
<body><main>
  <header><p class="eyebrow">BUILT WITH BPL</p><h1>Project board</h1><p>A small starting point for your college web application.</p></header>
  <form id="create"><label for="title">New task</label><div class="input-row"><input id="title" name="title" maxlength="120" required placeholder="What needs doing?"><button>Add task</button></div></form>
  <p id="status" role="status" aria-live="polite"></p>
  <ul id="tasks" aria-label="Tasks"></ul>
  <nav aria-label="Pages"><button id="previous">Previous</button><span id="page"></span><button id="next">Next</button></nav>
  <footer>SQLite persistence · validated JSON API · optional packages</footer>
</main></body></html>
